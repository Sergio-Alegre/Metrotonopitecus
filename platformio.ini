; Metrotonopitecus - metronome + tuner for M5Stack Cardputer ADV.
; NEVER upload over USB (would overwrite M5Launcher): build firmware.bin and
; install it through Launcher (WebUI / SD / OTA). See CLAUDE.md.

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.25
    m5stack/M5GFX@0.2.32

monitor_speed = 115200

; Same firmware plus an on-screen diagnostic overlay in the tuner (mic level,
; detector output, speaker state). Build with: pio run -e cardputer-adv-debug
[env:cardputer-adv-debug]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DTUNER_DEBUG=1

; Same firmware plus an on-screen LED diagnostic line in the metronome (LED present,
; started, flash count, delay after the click) and the L key (steady white for 2 s).
; Build with: pio run -e cardputer-adv-led-debug
[env:cardputer-adv-led-debug]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DLED_DEBUG=1

; ToneMap bench firmware (replaces the app): detector accuracy and timing on synthetic
; signals, then live microphone capture, all over serial. Build with:
; pio run -e cardputer-adv-tonemap-bench
; The bench replaces the app, so the filter excludes tonemap_view.cpp, the modes and the keyboard.
[env:cardputer-adv-tonemap-bench]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DTONEMAP_BENCH=1
    -Itest
build_src_filter =
    +<*>
    -<main.cpp>
    -<mode_*.cpp>
    -<tonemap_view.cpp>
    -<input.cpp>

; Normal firmware plus ToneMap diagnostics: one overlay line over the bottom grid row (analyses/s,
; analysis / draw / push ms, rms, clarity) and a serial line twice per second. Build with:
; pio run -e cardputer-adv-tonemap-debug
[env:cardputer-adv-tonemap-debug]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DTONEMAP_DEBUG=1
